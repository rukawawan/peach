name: Docker

# 只验收不发布：镜像的版本号、edge 与 latest 由 release.yml 在 GitHub Release 成功后推送，
# edge 与 latest 始终指向最新发布的版本（ADR-0121）。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Linux ${{ matrix.arch }} 镜像验收
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: longmeidao/peach:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: 验收临时容器
        run: python3 scripts/smoke_docker.py longmeidao/peach:test
